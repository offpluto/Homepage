<!DOCTYPE html>
<html>
<head>
  <title>Homepage</title>

  <style>
    html {
      align-items: center;
      color: #cdcdcd;
      display: flex;
      font: 22px "Courier New", Courier, monospace;
      height: 100%;
      justify-content: center;
      margin: 0;
    }

    body {
      display: flex;
      margin: 1em;
      padding: 1em;
      background-color: #171717;
    }

    h1 {
      font-size: 2em;
      grid-column: 1 / -1;
      margin: 0;
      text-align: center;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:focus,
    a:hover {
      color: #73e3c6;
    }

    nav {
      display: grid;
      grid-row-gap: 1em;
      grid-template-columns: 1fr 1fr;
      margin: 0 1em;
      min-width: 24em;
      padding: 1em 0;
    }

    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    li:first-child {
      font-weight: bold;
      line-height: 2em;
    }

    img {
      border: 0px solid #121212;
      height: auto;
      object-fit: cover;
      object-position: 50% 100%;
      width: 8em;
    }
  </style>
</head>
<body>
  <nav>
    <h1>Good Morning. Or Night?</h1>
    <ul>
      <li></li>
      <li><a href="https://anilist.co">AniList</a></li>
      <li><a href="https://youtube.com">YouTube</a></li>
      <li><a href="https://miruro.tv">Miruro</a></li>
      <li><a href="https://hianime.to/home">HiAnime</a></li>
      <li><a href="https://yugenanime.tv">Yugen</a></li>
      <li><a href="https://zerochan.net">ZeroChan</a></li>
      <li><a href="https://furaffinity.net">Furaffinity</a></li>
    </ul>
  </nav>

  <img src="file:///C:/Users\PrimeOS\Downloads\test-image.png">
</body>
</html>
